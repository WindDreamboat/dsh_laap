# dsh-laap Bundle 的插件装载清单（cordis patch）
# 相对路径会被 loader 解析为 file:// URL（发布 npm 包后改用包名 dsh-laap）。
#
# client-modules 注册中心要求「每个包只有一个激活的 loader 入口」：host 五个
# 子插件（service/tools/hooks/prompt/ui-host）统一由 ./src/index.ts 挂载，
# 因此这里只列一个入口；config 会透传给内核服务。
#
# 浏览器端半区（意识之球面板）不在此列——它由 package.json 的
# dsh.client + exports["./client"]（lib/client.js，pnpm build:client 产出）
# 声明，client-modules 沿本入口上溯到包清单后自动加载进浏览器。
- insert:
    - id: dsh-laap
      name: './src/index.ts'
      config:
        # zvec 库路径：必须本地文件系统（mmap 依赖），~ 会展开
        dbPath: '~/.dsh-laap/zvec-memory'
        # 性格：状态敏感系数 0.1–3
        sensitivity: 1
        # 心跳：无事件时的持续演化节律（ms，≥1000）
        heartbeatMs: 30000
        # 自传蒸馏周期（tick），0 关闭
        consolidateEvery: 120
        # 意识快照落盘周期（tick），0 = 仅卸载时保存（存在连续性）
        saveEvery: 20
        # 新异性阈值：与最近记忆相似度低于此值视为新奇（hash 口径 0.45，真嵌入建议 0.8）
        noveltyThreshold: 0.45
        # 新异事件自动归档情景记忆（节流）
        autoEpisodic: true
        # 嵌入默认 hash：内置 256 维哈希袋，0 依赖 / 离线 / 免 Key，克隆即用。
        # 本地切换真实嵌入无需改本文件（也不建议改，避免把个人配置提交进仓库）：
        # 在启动目录放 .env（dsh 宿主自动加载，已在 .gitignore），环境变量优先级高于本文件：
        #   本地 Ollama（先 ollama pull nomic-embed-text）：
        #     LAAP_EMBED_PROVIDER=ollama
        #     LAAP_EMBED_BASE_URL=http://localhost:11434/v1
        #     LAAP_EMBED_MODEL=nomic-embed-text
        #     LAAP_EMBED_DIMENSION=768
        #     LAAP_NOVELTY_THRESHOLD=0.8
        #   OpenAI 兼容接口：
        #     LAAP_EMBED_PROVIDER=openai
        #     LAAP_EMBED_BASE_URL=https://api.openai.com/v1
        #     LAAP_EMBED_MODEL=text-embedding-3-small
        #     LAAP_EMBED_DIMENSION=1536
        #     EMBEDDING_API_KEY=sk-...
        # 注意：换嵌入维度必须删除旧库目录（默认 ~/.dsh-laap/zvec-memory）重建。
        embedding:
          provider: hash
          apiKeyEnv: EMBEDDING_API_KEY
